[package]
name = "signal-orchestrate"
version = "6.0.0"
edition = "2024"
rust-version = "1.89"
description = "Signal contract for Orchestrate Lock coordination."
publish = false
build = "build.rs"
[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal/datom"]
[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "970459d" }
