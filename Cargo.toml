[package]
name = "signal-orchestrate"
version = "4.0.0"
edition = "2024"
rust-version = "1.89"
description = "Signal contract for Orchestrate Lock coordination."
publish = false
build = "build.rs"
[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]
[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09e2a9d52bf7f2f11e51d15cb6c3177f72c6c927", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "1febca7836bf8d5f5973a302fdd50aa9c84c159b", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "66e7b153706696c2cfbb2abcf931a5e83aec91af", default-features = false }
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "cf7dd128bcaead69e03ce1c2e6ac20c0c19a6823" }
