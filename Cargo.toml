[package]
name         = "signal-orchestrate"
version      = "0.14.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-orchestrate"
description  = "Signal contract — atomic Datom path-lock registration for the ordinary orchestrate channel."
publish      = false

[lib]
name = "signal_orchestrate"
path = "src/lib.rs"

[dependencies]
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "8aa0bcaeb29fe9e461a11706a469638d2fd109ac", default-features = false }
datom = { git = "https://github.com/LiGoldragon/datom.git", rev = "1b60b0c864ab96a82c307def27aae4d466ef0ec4" }
rkyv        = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dotos-text"))'] }
