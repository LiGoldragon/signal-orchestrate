[package]
name         = "signal-orchestrate"
version      = "0.18.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-orchestrate"
description  = "Signal contract for Orchestrate Lock coordination."
publish      = false

[lib]
name = "signal_orchestrate"
path = "src/lib.rs"

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "317a77134208" }
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "e448736972a3" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "2309e5b968b8702f2ecc679cd577b3e2bce0e99e" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
