[package]
name         = "signal-orchestrate"
version      = "0.19.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-orchestrate"
description  = "Signal contract for Orchestrate Lock coordination."
publish      = false

[lib]
name = "signal_orchestrate"
path = "src/lib.rs"

[dependencies]
protos = { git = "https://github.com/LiGoldragon/protos", rev = "56c683ec8d1e" }
datomic = { git = "https://github.com/LiGoldragon/datomic", rev = "768426ea5f34" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[dev-dependencies]
tempfile = "3"
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "b869598d13d220b8566170ed716017f42a840fad" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
